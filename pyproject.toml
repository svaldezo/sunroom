[project]
name = "sunroom"
version = "1.0.0"
description = "Understand anything, in the form that suits you."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# The engine alone, for a script or a notebook.
anthropic = ["anthropic>=0.40"]
pdf = ["pypdf>=4.0"]
web = ["beautifulsoup4>=4.12", "httpx>=0.27"]

# The web application on SQLite -- everything a laptop needs.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "cryptography>=42",
]
# What the deployed thing needs on top of that.
postgres = ["psycopg[binary,pool]>=3.2"]

all = [
    "anthropic>=0.40", "pypdf>=4.0", "beautifulsoup4>=4.12", "httpx>=0.27",
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9",
    "PyJWT[crypto]>=2.9", "cryptography>=42", "psycopg[binary,pool]>=3.2",
]
dev = [
    "pytest>=8.0",
    "playwright>=1.44",
    "ruff>=0.5",
]

[project.scripts]
prism = "prism.cli:main"
sunroom = "prism.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
"prism.web" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default: the suite is large enough that a wall of third-party
# warnings hides the one line that matters.
filterwarnings = [
    "ignore::DeprecationWarning:pypdf.*",
    "ignore::UserWarning:jwt.*",
]
markers = [
    "slow: takes more than a second",
    "load: a load test; not run by default",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",    # long lines are caught in review, not by a linter
    "B008",    # FastAPI's Depends() in a default is the documented idiom
    "S101",    # asserts are how tests are written
    "S608",    # the SQL here is composed from literals, never from input
    # `Optional[X]` is used consistently and reads better beside FastAPI's own
    # signatures. Rewriting 168 annotations to `X | None` would be churn with
    # no reader on the other end of it.
    "UP045", "UP007", "UP035", "UP037",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"tools/*" = ["S"]
