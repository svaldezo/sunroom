[project]
name = "sunroom"
version = "1.0.0"
description = "Understand anything, in the form that suits you."
readme = "README.md"
requires-python = ">=3.10"
# What the application needs to import and serve. These were optional extras
# until a Vercel deploy died on `ModuleNotFoundError: No module named
# 'fastapi'` -- installers read pyproject.toml in preference to
# requirements.txt, saw one dependency, and installed one dependency. Extras
# are for things a caller might not want; nothing here is optional to a running
# Sunroom, so nothing here is an extra.
#
# Kept in step with requirements.txt by tests/test_deploy_config.py, because
# two lists of the same thing drift, and this one drifts into a 500.
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "PyJWT[crypto]>=2.9",
    "cryptography>=42",
    "anthropic>=0.40",
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Retained so `pip install sunroom[server]` and the like keep working; they now
# resolve to nothing that is not already installed. uvicorn is the exception --
# a real ASGI server is genuinely optional, since Vercel brings its own and the
# container installs it explicitly.
anthropic = ["anthropic>=0.40"]
pdf = ["pypdf>=4.2"]
web = ["beautifulsoup4>=4.12", "httpx>=0.27"]
server = ["uvicorn[standard]>=0.30"]
postgres = ["psycopg[binary,pool]>=3.2"]

all = ["uvicorn[standard]>=0.30"]
dev = [
    "pytest>=8.0",
    "playwright>=1.44",
    "ruff>=0.5",
]

[project.scripts]
prism = "prism.cli:main"
sunroom = "prism.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
"prism.web" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default: the suite is large enough that a wall of third-party
# warnings hides the one line that matters.
filterwarnings = [
    "ignore::DeprecationWarning:pypdf.*",
    "ignore::UserWarning:jwt.*",
]
markers = [
    "slow: takes more than a second",
    "load: a load test; not run by default",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",    # long lines are caught in review, not by a linter
    "B008",    # FastAPI's Depends() in a default is the documented idiom
    "S101",    # asserts are how tests are written
    "S608",    # the SQL here is composed from literals, never from input
    # `Optional[X]` is used consistently and reads better beside FastAPI's own
    # signatures. Rewriting 168 annotations to `X | None` would be churn with
    # no reader on the other end of it.
    "UP045", "UP007", "UP035", "UP037",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"tools/*" = ["S"]
